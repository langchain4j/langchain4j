# Write log entries on tinylog's dedicated writer thread instead of the calling thread. This keeps
# logging off the I/O dispatch threads, so ApacheHttpClientPublisherNonBlockingIT (BlockHound) does
# not flag synchronous console writes as blocking I/O, including the client's own wire logging. The
# actual write happens on tinylog's writer thread, which is not in the policed non-blocking set.
writingthread = true
