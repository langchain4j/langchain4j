name: snapshot_release

on:
  repository_dispatch:
    types: [ trigger-snapshot-release ]
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: snapshot-release
  cancel-in-progress: false

jobs:
  snapshot_release:
    if: github.repository == 'langchain4j/langchain4j'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
        # Modules specify the oldest java version that they support:
        # even if we build with version 25, produced jars should be compatible with
        # JVMs running the version specified in each module's maven.compiler.target property
          java-version: '25'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      # Every push to main runs this, including the "Release versions x.y.z" commits, where the
      # version is not a SNAPSHOT. Deploying those re-publishes a release: it normally fails on
      # "already exists", but would push an unsigned release if a release ever died before deploying.
      - name: Check the version is a SNAPSHOT
        id: snapshot-check
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          case "$VERSION" in
            *-SNAPSHOT)
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              echo "Version is $VERSION."
              ;;
            *)
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Version is $VERSION, not a SNAPSHOT; skipping the snapshot deploy. If main is meant to be in development, run 'Update versions for next dev iteration'."
              ;;
          esac

      - name: snapshot_release
        if: steps.snapshot-check.outputs.proceed == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          mvn -B -U --fail-at-end -DskipTests -DskipITs clean deploy

      - name: Trigger SNAPSHOT release for langchain4j-spring repo
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_AUTOMATION }}
        run: |
          gh api repos/langchain4j/langchain4j-spring/dispatches \
            -f event_type=trigger-snapshot-release
