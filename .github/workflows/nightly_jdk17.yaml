name: Nightly Build JDK 17

on:
  schedule:
    - cron: '0 22 * * *'  # daily at 22:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-modules:
    if: github.repository == 'langchain4j/langchain4j'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: set-matrix
        shell: bash
        run: |
          echo "Discovering Maven modules..."
          modules=$(find . -type f -name pom.xml -exec dirname {} \; | sort | uniq | sed 's|^\./||' | grep -v '^$' | grep -v '^.$')
          echo "Detected modules:"
          echo "$modules"

          # number of parallel groups
          N=7

          # round-robin grouping
          matrix=$(echo "$modules" | awk -v N="$N" '
            {
              g = (NR - 1) % N
              arr[g] = (arr[g] ? arr[g] "," "\"" $0 "\"" : "\"" $0 "\"")
            }
            END {
              printf("{\"modules\": [");
              for (i = 0; i < N; i++) {
                if (i > 0) printf(",");
                printf("[%s]", arr[i])
              }
              print "]}"
            }
          ')

          echo "Generated matrix: $matrix"
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  latest-frameworks:
    # The Spring Boot starter and the Quarkus extension are released from other repositories, and the poms of
    # these two modules pin their versions. They are built only with the test-assertions-frameworks profile, so that
    # they never block other builds. Here they run on the latest releases, on the LangChain4j of this build.
    if: github.repository == 'langchain4j/langchain4j'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17.0.21+9
          distribution: 'temurin'
          cache: 'maven'

      - name: Find the latest releases of the Spring Boot starter and the Quarkus extension
        id: latest
        run: |
          set -o pipefail
          CENTRAL=https://repo1.maven.org/maven2
          # stable = only numbers, plus the "-betaNN" suffix that all langchain4j-spring releases carry
          latest() {
            curl -sSf "$CENTRAL/$1/maven-metadata.xml" | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' \
              | grep -E '^[0-9]+(\.[0-9]+)+(-beta[0-9]+)?$' | sort -V | tail -1
          }
          SPRING=$(latest dev/langchain4j/langchain4j-spring-boot-starter)
          SPRING_BOOT=$(curl -sSf "$CENTRAL/dev/langchain4j/langchain4j-spring-boot-starter/$SPRING/langchain4j-spring-boot-starter-$SPRING.pom" \
            | grep -A1 '<artifactId>spring-boot-starter</artifactId>' | sed -n 's:.*<version>\(.*\)</version>.*:\1:p')
          # the logback of this Spring Boot version: LangChain4j's parent manages logback-classic, so the apps pin it
          LOGBACK=$(curl -sSf "$CENTRAL/org/springframework/boot/spring-boot-dependencies/$SPRING_BOOT/spring-boot-dependencies-$SPRING_BOOT.pom" \
            | sed -n 's:.*<logback.version>\(.*\)</logback.version>.*:\1:p')
          QUARKUS_LC4J=$(latest io/quarkiverse/langchain4j/quarkus-langchain4j-core)
          QUARKUS=$(curl -sSf "$CENTRAL/io/quarkiverse/langchain4j/quarkus-langchain4j-parent/$QUARKUS_LC4J/quarkus-langchain4j-parent-$QUARKUS_LC4J.pom" \
            | sed -n 's:.*<quarkus.version>\(.*\)</quarkus.version>.*:\1:p')
          for VERSION in "$SPRING" "$SPRING_BOOT" "$LOGBACK" "$QUARKUS_LC4J" "$QUARKUS"; do
            if ! [[ "$VERSION" =~ ^[0-9A-Za-z.+-]+$ ]]; then
              echo "::error::Unexpected version '$VERSION'"
              exit 1
            fi
          done
          echo "::notice title=Latest frameworks::langchain4j-spring $SPRING (Spring Boot $SPRING_BOOT, logback $LOGBACK), quarkus-langchain4j $QUARKUS_LC4J (Quarkus $QUARKUS)"
          {
            echo "spring=$SPRING"
            echo "spring-boot=$SPRING_BOOT"
            echo "logback=$LOGBACK"
            echo "quarkus-langchain4j=$QUARKUS_LC4J"
            echo "quarkus=$QUARKUS"
          } >> "$GITHUB_OUTPUT"

      - name: Test with the latest releases
        env:
          SPRING: ${{ steps.latest.outputs.spring }}
          SPRING_BOOT: ${{ steps.latest.outputs.spring-boot }}
          LOGBACK: ${{ steps.latest.outputs.logback }}
          QUARKUS_LC4J: ${{ steps.latest.outputs.quarkus-langchain4j }}
          QUARKUS: ${{ steps.latest.outputs.quarkus }}
        run: |
          mvn -B -U -DskipTests -DskipITs install -pl langchain4j-core,langchain4j,langchain4j-test -am

          mvn -B -U verify -Ptest-assertions-frameworks \
            "-Dlangchain4j-spring.version=$SPRING" "-Dspring-boot.version=$SPRING_BOOT" "-Dlogback.version=$LOGBACK" \
            "-Dquarkus-langchain4j.version=$QUARKUS_LC4J" "-Dquarkus.version=$QUARKUS" \
            -pl integration-tests/integration-tests-test-assertions/integration-tests-test-assertions-spring-starter,integration-tests/integration-tests-test-assertions/integration-tests-test-assertions-quarkus-extension

  build:
    needs: discover-modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-modules.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17.0.21+9
          distribution: 'temurin'
          cache: 'maven'

      - name: Authenticate to Google Cloud
        # Required for Google modules (e.g., langchain4j-vertex-ai)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Setup JBang
        # Required for MCP module
        uses: jbangdev/setup-jbang@2b1b465a7b75f4222b81426f23a01e013aa7b95c # v0.1.1
        continue-on-error: true

      - name: Decide whether tonight is the Jackson 3 run
        id: jackson3
        # The opt-in swaps the JSON codec, and unit tests can only prove so much about a wire
        # format. One of the three nightlies runs the integration tests on Jackson 3 instead of
        # Jackson 2, so every night exactly one does and each JDK takes its turn every third day.
        # Deterministic rather than random: given the date you can tell which ran, and re-running
        # the same day reproduces it. The clock is shifted by 3 hours so that all nightlies of one
        # night (22:00, 01:00 and 04:00 UTC) share the same day number.
        run: |
          if [ $(( 10#$(date -u -d '+3 hours' +%j) % 3 )) -eq 0 ]; then
            echo "profile=-Pjackson3" >> "$GITHUB_OUTPUT"
            echo "label=Jackson 3" >> "$GITHUB_OUTPUT"
            echo "::notice title=JSON codec::Integration tests are running on Jackson 3 tonight (JDK 17)."
          else
            echo "profile=" >> "$GITHUB_OUTPUT"
            echo "label=Jackson 2" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with JDK 17 on ${{ steps.jackson3.outputs.label }}
        run: |
          modules="${{ join(matrix.modules, ',') }}"
          exclude_modules="langchain4j-jlama,langchain4j-jitllm,langchain4j-gpu-llama3"
          for ex in ${exclude_modules//,/ }; do
            modules=$(echo "$modules" | sed "s/\b${ex}\b//g" | sed 's/,,/,/g' | sed 's/^,//' | sed 's/,$//')
          done
          echo "Building modules: $modules"
          
          ## compile and install ALL modules to avoid running integration tests on dependent modules in the step below
          ## retried once after 2 minutes, as a transient Maven Central failure would otherwise skip all tests of this job;
          ## the retry clears MAVEN_ARGS (where setup-java puts -ntp), so that its log shows every download from Maven Central
          mvn -B -U -T8C -DskipTests -DskipITs -DembeddingsSkipCache install || { sleep 120; MAVEN_ARGS= mvn -B -U -T8C -DskipTests -DskipITs -DembeddingsSkipCache install; }

          ## kill a module's test JVM after 2 h (with a thread dump in target/*-reports), so that a hung test
          ## does not cost the rest of the modules (the slowest module, langchain4j-google-ai-gemini, takes ~80 min)
          ## the test-assertions-frameworks profile adds the apps that build against released framework versions
          ## -Dmaven.test.failure.ignore=true and the check below MUST stay together:
          ## - with the property, a failed test does not fail its module, so Maven still runs the tests of the modules
          ##   that depend on it; without it, one flaky test skips all of them
          ## - the property alone hides failures: Maven ends with BUILD SUCCESS and the job stays green
          ## - the check fails this step on failed tests and test errors, on a test JVM killed by the timeout above or
          ##   crashed, on tests skipped because a variable in env: below is empty (a missing secret), and on any
          ##   Maven failure, with error annotations that name the failing test classes
          ## - still skipped: the modules that depend on a module that does not compile or whose test JVM crashed
          ##   (Maven fails that module, BUILD FAILURE)
          maven_exit=0
          mvn -B -U verify ${{ steps.jackson3.outputs.profile }} -Ptest-assertions-frameworks \
            -Dsurefire.timeout=7200 \
            -Dfailsafe.timeout=7200 \
            -Dmaven.test.failure.ignore=true \
            -pl "${modules}" \
            -DskipAzureAiSearchITs -DskipJlamaITs -DskipLocalAiITs -DskipMilvusITs -DskipOllamaITs -DskipOracleITs -DskipVespaITs \
            --fail-at-end \
            -Djunit.jupiter.extensions.autodetection.enabled=true \
            -DembeddingsSkipCache \
            -Dtinylog.writer.level=info || maven_exit=$?

          ## the check: it also runs when Maven failed, so that failed tests of other modules are reported too
          MAVEN_EXIT="$maven_exit" python3 << 'PYEOF'
          import glob, os, re, sys
          import xml.etree.ElementTree as ET

          def escape(text, prop=False):
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              return text.replace(':', '%3A').replace(',', '%2C') if prop else text

          def module_of(path):
              return path.split('/target/')[0]

          maven_exit = int(os.environ['MAVEN_EXIT'])
          problems = []  # (module, what went wrong), the ones that stopped tests from running first
          failed_classes = {}  # module -> [(test class, its failed tests)]
          skipped_by_empty_variable = {}  # variable from env: -> number of tests skipped because it is empty
          if maven_exit:
              problems.append(('Maven', f'Maven failed (exit code {maven_exit}): a module did not compile, a plugin failed '
                               'or a test JVM crashed, and the modules of this job that depend on it were skipped. '
                               'See BUILD FAILURE and the Reactor Summary in the log'))
          for path in sorted(glob.glob('**/target/failsafe-reports/failsafe-summary.xml', recursive=True)):
              try:
                  timeout = ET.parse(path).getroot().get('timeout') == 'true'
              except Exception as e:
                  problems.append((module_of(path), f'unreadable test report {path} ({e})'))
                  continue
              if timeout:
                  problems.append((module_of(path), 'failsafe killed the test JVM after the timeout, the tests after the hung one did not run'))
          # surefire writes no summary: a thread dump of its test JVM is the only trace of a timeout
          for path in sorted(glob.glob('**/target/surefire-reports/*.dump', recursive=True)):
              problems.append((module_of(path), f'surefire killed the test JVM after the timeout, or lost it otherwise ({path})'))
          for path in sorted(glob.glob('**/target/*-reports/TEST-*.xml', recursive=True)):
              try:
                  root = ET.parse(path).getroot()
                  failed = int(root.get('failures', 0)) + int(root.get('errors', 0))
              except Exception as e:
                  problems.append((module_of(path), f'unreadable test report {path} ({e})'))
                  continue
              if failed > 0:
                  test_class = (root.get('name') or os.path.basename(path)[5:-4]).rsplit('.', 1)[-1]
                  tests = sorted({tc.get('name', '').split('(')[0].split('[')[0] for tc in root.iter('testcase')
                                  if tc.find('failure') is not None or tc.find('error') is not None})
                  names = ', '.join(tests[:3]) + (f' and {len(tests) - 3} more' if len(tests) > 3 else '')
                  failed_classes.setdefault(module_of(path), []).append((test_class, f'{failed} of {root.get("tests")} tests failed ({names})'))
              for skipped in root.iter('skipped'):
                  match = re.search(r'Environment variable \[(\w+)\] with value \[\] does not match', skipped.get('message') or '')
                  if match and os.environ.get(match.group(1)) == '':
                      skipped_by_empty_variable[match.group(1)] = skipped_by_empty_variable.get(match.group(1), 0) + 1
          for variable, count in sorted(skipped_by_empty_variable.items()):
              problems.append((variable, f'{variable} is empty (a missing secret?), so {count} tests were skipped'))

          if not problems and not failed_classes:
              sys.exit(0)

          annotations = list(problems)
          for module, classes in failed_classes.items():
              if len(classes) == 1:
                  annotations.append((module, f'{classes[0][0]}: {classes[0][1]}'))
              else:
                  names = ', '.join(c for c, _ in classes[:5]) + (f' and {len(classes) - 5} more' if len(classes) > 5 else '')
                  annotations.append((module, f'{len(classes)} test classes failed: {names}'))
          # GitHub shows at most 10 error annotations per step, and the runner adds one when the step fails
          if len(annotations) > 9:
              annotations = annotations[:8] + [('More failures', f'{len(annotations) - 8} more, see the job summary')]
          if not maven_exit:
              print('BUILD SUCCESS above does not mean that the tests passed:')
          for module, text in annotations:
              print(f'::error title={escape(module, True)}::{escape(text)}')
          details = [f'`{module}`: {problem}' for module, problem in problems]
          details += [f'`{module}`: {c}: {tests}' for module, classes in failed_classes.items() for c, tests in classes]
          print('\n'.join(details))

          with open(os.environ.get('GITHUB_STEP_SUMMARY', os.devnull), 'a') as summary:
              summary.write('## :x: Why this job failed\n\n')
              summary.write(''.join(f'- {line}\n' for line in details[:50]))
              if len(details) > 50:
                  summary.write(f'- ... and {len(details) - 50} more, see the log of this step\n')
              summary.write('\nThe error message of every failed test is in Test Results below.\n\n')
          sys.exit(maven_exit or 1)
          PYEOF

        env:
          LC4J_GLOBAL_TEST_RETRY_ENABLED: true
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_CACHING_BASE_URL: ${{ secrets.ANTHROPIC_CACHING_BASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AZURE_OPENAI_AUDIO_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_AUDIO_DEPLOYMENT_NAME }}
          AZURE_OPENAI_AUDIO_ENDPOINT: ${{ secrets.AZURE_OPENAI_AUDIO_ENDPOINT }}
          AZURE_OPENAI_AUDIO_KEY: ${{ secrets.AZURE_OPENAI_AUDIO_KEY }}
          AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}
          AZURE_SEARCH_KEY: ${{ secrets.AZURE_SEARCH_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ELASTICSEARCH_CLOUD_API_KEY: ${{ secrets.ELASTICSEARCH_CLOUD_API_KEY }}
          ELASTICSEARCH_CLOUD_URL: ${{ secrets.ELASTICSEARCH_CLOUD_URL }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          GCP_LOCATION: ${{ secrets.GCP_LOCATION }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_NUM: ${{ secrets.GCP_PROJECT_NUM }}
          GCP_VERTEXAI_ENDPOINT: ${{ secrets.GCP_VERTEXAI_ENDPOINT }}
          GOOGLE_AI_GEMINI_API_KEY: ${{ secrets.GOOGLE_AI_GEMINI_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          MICROSOFT_FOUNDRY_API_KEY: ${{ secrets.MICROSOFT_FOUNDRY_API_KEY }}
          MICROSOFT_FOUNDRY_ENDPOINT: ${{ secrets.MICROSOFT_FOUNDRY_ENDPOINT }}
          MILVUS_API_KEY: ${{ secrets.MILVUS_API_KEY }}
          MILVUS_URI: ${{ secrets.MILVUS_URI }}
          MISTRAL_AI_API_KEY: ${{ secrets.MISTRAL_AI_API_KEY }}
          NOMIC_API_KEY: ${{ secrets.NOMIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OVHAI_AI_API_KEY: ${{ secrets.OVHAI_AI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          WEAVIATE_API_KEY: ${{ secrets.WEAVIATE_API_KEY }}
          WEAVIATE_HOST: ${{ secrets.WEAVIATE_HOST }}
          CI_DELAY_SECONDS_AZURE_AI_SEARCH: 4
          CI_DELAY_SECONDS_AZURE_OPENAI: 3
          CI_DELAY_SECONDS_BEDROCK: 3
          CI_DELAY_SECONDS_GOOGLE_AI_GEMINI: 20
          CI_DELAY_SECONDS_GOOGLE_AI_GEMINI_BATCH: 20
          CI_DELAY_SECONDS_VERTEX_AI: 5
          CI_DELAY_SECONDS_VERTEX_AI_ANTHROPIC: 12
          CI_DELAY_SECONDS_VERTEX_AI_GEMINI: 12
          CI_DELAY_SECONDS_VOYAGE_AI: 22

      - name: Clean Docker
        run: docker system prune -af || true

      - name: Publish Test Summary
        if: always()
        run: |
          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET
          import glob, os, re

          files = glob.glob('**/target/*-reports/TEST-*.xml', recursive=True)
          total = failures = errors = skipped = 0
          failed_tests = []

          for path in files:
              try:
                  root = ET.parse(path).getroot()
                  total += int(root.get('tests', 0))
                  failures += int(root.get('failures', 0))
                  errors += int(root.get('errors', 0))
                  skipped += int(root.get('skipped', 0))
                  for tc in root.findall('.//testcase'):
                      fail = tc.find('failure')
                      if fail is None:
                          fail = tc.find('error')
                      if fail is not None:
                          cls = tc.get('classname', '')
                          name = tc.get('name', '')
                          trace = fail.text or ''
                          m = re.search(r'\bat ' + re.escape(cls) + r'[.$][^\n(]*\(([^)]+\.java:\d+)\)', trace)
                          loc = f'`{m.group(1)}`' if m else ''
                          msg = (fail.get('message', '') or '').replace('\n', '<br>').replace('|', '\\|')
                          if len(msg) > 500:
                              msg = f"{msg[:500]}<details><summary>show more</summary>{msg[500:]}</details>"
                          failed_tests.append(f"| `{cls}` | `{name}` | {loc} | {msg} |")
              except Exception:
                  pass

          passed = total - failures - errors - skipped
          summary = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null')
          with open(summary, 'a') as f:
              f.write('## Test Results\n\n')
              if failures == 0 and errors == 0:
                  f.write(f':white_check_mark: **{passed} passed**, {skipped} skipped out of {total} tests\n')
              else:
                  f.write(f':x: **{failures} failed, {errors} errors**, {passed} passed, {skipped} skipped out of {total} tests\n')
              if failed_tests:
                  f.write('\n### Failures\n\n')
                  f.write('| Class | Test | Location | Error Message |\n')
                  f.write('|-------|------|----------|---------------|\n')
                  for line in failed_tests[:50]:
                      f.write(line + '\n')
                  if len(failed_tests) > 50:
                      f.write(f'\n*... and {len(failed_tests) - 50} more*\n')
          PYEOF
