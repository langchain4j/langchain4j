# test classes run one after another; only the test methods annotated with @Execution(CONCURRENT) run in parallel
# with each other (on a class, @Execution(CONCURRENT) would also run it at the same time as the other test classes)
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=same_thread
